<!--?xml version="1.0" encoding="UTF-8"?-->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">

  <defs>
    <radialGradient id="petalGradient" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#ffffff"></stop>
      <stop offset="70%" stop-color="#ffd7ea"></stop>
      <stop offset="100%" stop-color="#ff9ec7"></stop>
    </radialGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#d67ba8" flood-opacity="0.25"></feDropShadow>
    </filter>
  </defs>

  <g filter="url(#shadow)">

    <ellipse cx="32" cy="16" rx="10" ry="18" fill="url(#petalGradient)" transform="rotate(0 32 32)"></ellipse>

    <ellipse cx="32" cy="16" rx="10" ry="18" fill="url(#petalGradient)" transform="rotate(72 32 32)"></ellipse>

    <ellipse cx="32" cy="16" rx="10" ry="18" fill="url(#petalGradient)" transform="rotate(144 32 32)"></ellipse>

    <ellipse cx="32" cy="16" rx="10" ry="18" fill="url(#petalGradient)" transform="rotate(216 32 32)"></ellipse>

    <ellipse cx="32" cy="16" rx="10" ry="18" fill="url(#petalGradient)" transform="rotate(288 32 32)"></ellipse>

    <circle cx="32" cy="32" r="5" fill="#ffe86b"></circle>

    <circle cx="30" cy="30" r="1" fill="#c58b00"></circle>
    <circle cx="34" cy="31" r="1" fill="#c58b00"></circle>
    <circle cx="32" cy="34" r="1" fill="#c58b00"></circle>
    <circle cx="29" cy="33" r="1" fill="#c58b00"></circle>
    <circle cx="35" cy="34" r="1" fill="#c58b00"></circle>

  </g>

</svg>